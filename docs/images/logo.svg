<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="slate-plate-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="slate-plate-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Watertight Base Silhouette for Axolotl Mascot -->
      <path d="
        M 0,-180
        L 90,-160 L 140,-130 L 220,-220 L 250,-190 L 180,-100
        L 270,-110 L 290,-70 L 190,-40
        L 250,10 L 240,50 L 160,30
        L 130,120 L 80,240 L 0,270
        L -80,240 L -130,120 L -160,30
        L -240,50 L -250,10 L -190,-40
        L -290,-70 L -270,-110 L -180,-100
        L -250,-190 L -220,-220 L -140,-130
        L -90,-160 Z
      " fill="#0b0f19" />

      <!-- External Regeneration Branch Gills (Right Side) -->
      <!-- Top Gill -->
      <polygon points="140,-130 220,-220 250,-190 180,-100 130,-90" fill="url(#cyan-glow)" />
      <polygon points="140,-130 180,-100 130,-90" fill="#0284c7" />
      <polygon points="180,-100 250,-190 220,-220" fill="#38bdf8" />
      
      <!-- Middle Gill -->
      <polygon points="150,-80 270,-110 290,-70 190,-40 140,-50" fill="url(#cyan-glow)" />
      <polygon points="150,-80 190,-40 140,-50" fill="#0369a1" />
      <polygon points="190,-40 290,-70 270,-110" fill="#10b981" />

      <!-- Lower Gill -->
      <polygon points="140,-30 250,10 240,50 160,30 120,0" fill="url(#emerald-glow)" />
      <polygon points="140,-30 160,30 120,0" fill="#047857" />
      <polygon points="160,30 240,50 250,10" fill="#34d399" />

      <!-- External Regeneration Branch Gills (Left Side - Symmetrical) -->
      <!-- Top Gill -->
      <polygon points="-140,-130 -220,-220 -250,-190 -180,-100 -130,-90" fill="url(#cyan-glow)" />
      <polygon points="-140,-130 -180,-100 -130,-90" fill="#0284c7" />
      <polygon points="-180,-100 -250,-190 -220,-220" fill="#38bdf8" />

      <!-- Middle Gill -->
      <polygon points="-150,-80 -270,-110 -290,-70 -190,-40 -140,-50" fill="url(#cyan-glow)" />
      <polygon points="-150,-80 -190,-40 -140,-50" fill="#0369a1" />
      <polygon points="-190,-40 -290,-70 -270,-110" fill="#10b981" />

      <!-- Lower Gill -->
      <polygon points="-140,-30 -250,10 -240,50 -160,30 -120,0" fill="url(#emerald-glow)" />
      <polygon points="-140,-30 -160,30 -120,0" fill="#047857" />
      <polygon points="-160,30 -240,50 -250,10" fill="#34d399" />

      <!-- Central Head Mesh & Crown Facets -->
      <polygon points="0,-180 90,-160 50,-100 0,-120" fill="#334155" />
      <polygon points="0,-180 -90,-160 -50,-100 0,-120" fill="#1e293b" />

      <!-- Forehead Keystone Facet -->
      <polygon points="0,-120 50,-100 0,-50 -50,-100" fill="#475569" />

      <!-- Upper Cheeks / Temporal Plates -->
      <polygon points="90,-160 140,-110 90,-60 50,-100" fill="#1e293b" />
      <polygon points="-90,-160 -140,-110 -90,-60 -50,-100" fill="#0f172a" />

      <polygon points="140,-110 150,-50 90,-40 90,-60" fill="#334155" />
      <polygon points="-140,-110 -150,-50 -90,-40 -90,-60" fill="#1e293b" />

      <!-- Eyes (Almond Predator Geometry with Electric Optics) -->
      <!-- Right Eye -->
      <polygon points="50,-80 85,-70 60,-55 45,-68" fill="#00f5ff" />
      <polygon points="58,-75 75,-70 62,-60" fill="#ffffff" />
      
      <!-- Left Eye -->
      <polygon points="-50,-80 -85,-70 -60,-55 -45,-68" fill="#00f5ff" />
      <polygon points="-58,-75 -75,-70 -62,-60" fill="#ffffff" />

      <!-- Snout & Whisker Bridges -->
      <polygon points="0,-50 50,-100 90,-60 60,-20 0,0" fill="#334155" />
      <polygon points="0,-50 -50,-100 -90,-60 -60,-20 0,0" fill="#1e293b" />

      <!-- Lower Jaw / Smile Contour (Signature Axolotl Gentle Expression) -->
      <polygon points="0,0 60,-20 90,-10 60,40 0,60" fill="#475569" />
      <polygon points="0,0 -60,-20 -90,-10 -60,40 0,60" fill="#334155" />

      <polygon points="60,40 120,30 90,80 40,90 0,60" fill="#1e293b" />
      <polygon points="-60,40 -120,30 -90,80 -40,90 0,60" fill="#0f172a" />

      <!-- Throat & Cellular Regeneration Core -->
      <polygon points="0,60 40,90 0,140 -40,90" fill="url(#cyan-glow)" />

      <!-- Chest Armor Plates -->
      <polygon points="0,140 40,90 90,130 50,190 0,210" fill="#334155" />
      <polygon points="0,140 -40,90 -90,130 -50,190 0,210" fill="#1e293b" />

      <polygon points="50,190 90,130 110,180 70,240 0,260 0,210" fill="#0f172a" />
      <polygon points="-50,190 -90,130 -110,180 -70,240 0,260 0,210" fill="#0b0f19" />

      <!-- Subtle Geometric Core Nodes -->
      <circle cx="0" cy="100" r="5" fill="#ffffff" />
      <circle cx="0" cy="-85" r="4" fill="#00f5ff" />

    </g>
  </g>
</svg>